name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      # Pinned to a commit, not a tag a maintainer can move (security review
      # S35). Dependabot proposes new pins and keeps the version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: next/requirements-dev.txt
      # The page tests run the page's JavaScript in node. CI=true makes the
      # suite fail rather than skip them if node is ever missing here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -rs
